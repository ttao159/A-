<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A股自动交易助手 - 手机预览</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <div class="phone">
      <!-- 状态栏 -->
      <div class="statusbar">
        <span class="sb-time" id="sb-time">10:00</span>
        <span class="sb-icons">
          <span class="sb-signal">▂▄▆█</span>
          <span class="sb-wifi">◠◠</span>
          <span class="sb-battery">🔋</span>
        </span>
      </div>

      <!-- 应用栏 -->
      <div class="appbar" id="appbar">
        <span class="appbar-title" id="appbar-title">账户</span>
      </div>

      <!-- 主内容区 -->
      <div class="content" id="content"></div>

      <!-- 底部导航 -->
      <div class="bottombar">
        <div class="tab active" data-tab="home">
          <span class="tab-icon">🏠</span>
          <span class="tab-label">首页</span>
        </div>
        <div class="tab" data-tab="strategy">
          <span class="tab-icon">📈</span>
          <span class="tab-label">策略</span>
        </div>
        <div class="tab" data-tab="trade">
          <span class="tab-icon">📋</span>
          <span class="tab-label">交易</span>
        </div>
        <div class="tab" data-tab="mine">
          <span class="tab-icon">👤</span>
          <span class="tab-label">我的</span>
        </div>
      </div>

      <!-- 策略编辑层（全屏覆盖） -->
      <div class="editor" id="editor"></div>

      <!-- 策略生成引擎层（全屏覆盖） -->
      <div class="editor" id="generator"></div>

      <!-- 提示层 -->
      <div class="toast" id="toast"></div>

      <!-- 策略名称对话框 -->
      <div class="dialog-mask" id="name-dialog">
        <div class="dialog">
          <div class="dialog-title">保存策略</div>
          <div class="dialog-desc">请输入策略名称</div>
          <input class="dialog-input" id="dialog-name" placeholder="例如：均线金叉策略" />
          <div class="dialog-actions">
            <button class="dialog-btn" id="dialog-cancel">取消</button>
            <button class="dialog-btn primary" id="dialog-ok">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
