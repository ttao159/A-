<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>A股自动交易助手</title>
    <link rel="dns-prefetch" href="//hq.sinajs.cn" />
    <link rel="dns-prefetch" href="//vip.stock.finance.sina.com.cn" />
    <link rel="dns-prefetch" href="//qt.gtimg.cn" />
    <link rel="preconnect" href="//hq.sinajs.cn" crossorigin />
    <link rel="preconnect" href="//qt.gtimg.cn" crossorigin />
    <style>
      #app {
        min-height: 100vh;
      }
      .boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        color: #909399;
        font-size: 13px;
      }
      .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid #e4e7ed;
        border-top-color: #1a73e8;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">
        <div class="boot-spinner"></div>
        <div class="boot-text">A股助手加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
